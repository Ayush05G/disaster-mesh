<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Critical Rule 1 enforced in the browser itself: connect-src 'self'
      means any accidental external fetch is blocked by CSP before it ever
      reaches the network — defense in depth alongside scripts/audit-offline.js.
      No CDN fonts, no remote tiles, no external anything.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'"
    />
    <title>Aether Mesh Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
